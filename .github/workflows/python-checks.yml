name: Python checks

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile .streamlit/app.py .streamlit/agent.py .streamlit/tools.py .streamlit/sandbox.py
      - run: pytest -q
      - name: Streamlit startup smoke test
        shell: bash
        run: |
          streamlit run .streamlit/app.py --server.headless true --server.port 8501 > /tmp/oryn-streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit health endpoint responded."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/oryn-streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/oryn-streamlit.log
          echo "Streamlit did not become healthy in time."
          exit 1
